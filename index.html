<body style="background:#200f18; color:#f5e6e8; text-align:center; font-family:Georgia; padding:25px;">

    <h1>Las palabras que no supe decir 🥀</h1>

    <p>Hay cosas que cuesta decir en voz alta...</p>

    <button onclick="document.getElementById('carta').hidden = false">
        Abrir mi mensaje ♡
    </button>

    
<div id="carta" hidden>
    <h2>Las palabras que no supe decir 🥀</h2>

    
<textarea id="textoCarta" rows="20" cols="40"
style="background:#F0E4D4; color:#4A1728; border:2px solid #8B3A50; padding:15px; font-family:Georgia; font-size:15px; line-height:1.6;">
No sé si algún día llegarás a leer estas palabras, pero hay algo que necesito reconocer: me equivoqué contigo y lo siento de corazón.

Sé que escuchaste lo que pasó en aquel live. Otra chica empezó a coquetearme y yo decidí seguirle el juego, pensando que era una broma, sin detenerme a pensar en cómo te sentirías al escucharlo. Pero ahora entiendo que no basta con decir que estaba jugando para quitarle importancia a lo que hice.

Debí pensar en ti, en tus sentimientos y en el respeto que merece nuestra relación. No quiero usar una broma como excusa, porque fui yo quien decidió participar y soy yo quien debe hacerse responsable de ello.

Me duele saber que mis acciones pudieron hacerte sentir que no valoraba lo nuestro. Nunca debiste tener que escuchar algo así ni preguntarte si realmente te respeto. Entiendo que estés dolida, decepcionada o que necesites alejarte de mí.

No voy a pedirte que olvides lo ocurrido ni que me perdones solo porque te estoy escribiendo esto. Sé que la confianza no se recupera con una carta bonita, sino con acciones que demuestren un cambio verdadero.

Quisiera poder volver a ese momento y actuar de otra manera, pero no puedo. Lo único que puedo hacer ahora es reconocer mi error, aprender de él y no volver a tratar algo tan importante como nuestra relación como si fuera un juego.

No sé qué estás pensando ni qué decidirás sobre nosotros. Me gustaría tener la oportunidad de hablar contigo cuando te sientas preparada, pero voy a respetar tu espacio y tu decisión. No quiero que sientas que tienes que responderme por obligación.

Si algún día decides darme otra oportunidad, quiero demostrarte con hechos que puedo hacerlo mejor. No te prometo ser perfecto; te prometo tomar en serio mis errores y trabajar para no volver a lastimarte de la misma manera.

Perdóname por no haber cuidado tus sentimientos cuando más debía hacerlo.

No escribo esto para borrar lo que pasó, sino porque reconozco que te lastimé y lamento haber sido la razón de tu dolor.

Si todavía queda una oportunidad para nosotros, me gustaría aprender de este error y construir algo en lo que puedas sentirte respetada, querida y segura.

Y si necesitas tiempo, lo entiendo. No quiero que mis ganas de arreglar las cosas estén por encima de lo que tú necesitas.

Lo siento, de verdad. 🥀</textarea>
